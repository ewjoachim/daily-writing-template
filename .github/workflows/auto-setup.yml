name: auto-setup

on:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  auto-setup:
    if: contains(join(github.event.issue.labels.*.name, ','), 'auto-setup')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

      - name: Parse issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/issue-parser" @github/issue-parser
          cd "$RUNNER_TEMP/issue-parser"
          node --input-type=module - <<'EOF'
          import { parseIssue } from '@github/issue-parser';
          import fs from 'node:fs';
          import path from 'node:path';

          const issueBody = process.env.ISSUE_BODY ?? '';
          const templatePath = path.join(process.env.GITHUB_WORKSPACE, '.github', 'ISSUE_TEMPLATE', 'auto-setup.yml');
          const template = fs.readFileSync(templatePath, 'utf8');
          const parsed = parseIssue(issueBody, template);

          fs.appendFileSync(process.env.GITHUB_ENV, `ISSUE_VALUES=${JSON.stringify(parsed ?? {})}\n`);
          EOF

      - name: Set up UV
        id: setup-uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Update site configuration
        shell: uv run --with=tomlkit python {0}
        run: |
          import json
          import os
          import pathlib

          import tomlkit

          workspace = pathlib.Path()
          config_path = workspace / 'daily-writing.toml'
          document = tomlkit.parse(config_path.read_text())
          issue_values = json.loads(os.environ['ISSUE_VALUES'])
          # Dropdown answers arrive as lists (the parser supports multi-select);
          # ours are single-select, we need to unwrap.
          issue_values = {
              key: value[0] if isinstance(value, list) and len(value) == 1 else value
              for key, value in issue_values.items()
          }
          document.update(issue_values)

          config_path.write_text(tomlkit.dumps(document))

      - name: Cleanup issue template
        run: rm .github/ISSUE_TEMPLATE/auto-setup.yml

      - name: Disable setup workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN may not push changes to .github/workflows files, so we
          # can't delete these; disable them through the Actions API instead.
          gh workflow disable auto-setup.yml
          gh workflow disable auto-setup-init.yml

      - name: Run prek
        run: uvx prek run --show-diff-on-failure --all-files || true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Same restriction: exclude .github/workflows so prek's reformatting of
          # a workflow file can't sneak into the commit and get the push rejected.
          git add -A -- . ':!.github/workflows'
          git commit -m "chore: apply auto-setup from issue" || echo "No changes to commit"
          git push

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "✅ Setup complete! See the [user manual](../blob/main/USER_MANUAL.md#user-manual) to get started."
